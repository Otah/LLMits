<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Claude Usage</title>

<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
<link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="theme-color" content="#2a78d6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Claude Usage">

<style>
  :root {
    color-scheme: light;
    --page:            #f9f9f7;
    --surface-1:       #fcfcfb;
    --text-primary:    #0b0b0b;
    --text-secondary:  #52514e;
    --text-muted:      #898781;
    --border:          rgba(11,11,11,0.10);
    --track:           #e1e0d9;
    --good:            #0ca30c;
    --warning:         #fab219;
    --serious:         #ec835a;
    --critical:        #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --page:            #0d0d0d;
      --surface-1:       #1a1a19;
      --text-primary:    #ffffff;
      --text-secondary:  #c3c2b7;
      --text-muted:      #898781;
      --border:          rgba(255,255,255,0.10);
      --track:           #2c2c2a;
      --good:            #0ca30c;
      --warning:         #fab219;
      --serious:         #ec835a;
      --critical:        #e66767;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  html {
    min-height: 100%;
    background: var(--page);
  }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .viz-root {
    display: block;
    min-height: 100vh;
    background: var(--page);
    color: var(--text-primary);
  }
  .page {
    max-width: 720px;
    margin: 0 auto;
    padding: calc(40px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) calc(64px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));
  }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .notify-row {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 20px;
  }
  .notify-btn {
    font: inherit;
    font-size: 12px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface-1);
    color: var(--text-secondary);
    cursor: pointer;
  }
  .notify-btn:disabled {
    opacity: 0.6;
    cursor: default;
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0;
    color: var(--text-primary);
  }
  .updated {
    font-size: 13px;
    color: var(--text-muted);
  }
  .cards {
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
  }
  .card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 22px;
  }
  .card-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .label {
    font-size: 14px;
    color: var(--text-secondary);
  }
  .value {
    font-size: 32px;
    font-weight: 600;
    line-height: 1;
    color: var(--text-primary);
  }
  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
  }
  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
  }
  .meter-track {
    height: 10px;
    border-radius: 5px;
    background: var(--track);
    overflow: hidden;
    margin-top: 4px;
  }
  .meter-fill {
    height: 100%;
    border-radius: 5px;
    transition: width 0.4s ease;
  }
  .meter-pace-track {
    height: 4px;
    border-radius: 2px;
    background: var(--track);
    overflow: hidden;
    margin-top: 6px;
  }
  .meter-pace-fill {
    height: 100%;
    border-radius: 2px;
    background: var(--text-secondary);
    opacity: 0.6;
    transition: width 0.4s ease;
  }
  .sub {
    margin-top: 10px;
    font-size: 13px;
    color: var(--text-muted);
  }
  .error {
    background: var(--surface-1);
    border: 1px solid var(--critical);
    color: var(--critical);
    border-radius: 12px;
    padding: 16px 20px;
    font-size: 14px;
  }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="viz-root">
  <div class="page">
    <header>
      <h1>Claude Usage</h1>
      <span class="updated" id="updated">loading…</span>
    </header>

    <div class="notify-row">
      <button id="notify-btn" class="notify-btn">Enable notifications</button>
    </div>

    <div id="error" class="error hidden"></div>

    <div class="cards" id="cards"></div>
  </div>
</div>

<script>
const STATUS_COLOR = {
  good: 'var(--good)',
  warning: 'var(--warning)',
  serious: 'var(--serious)',
  critical: 'var(--critical)',
};

function severityToStatus(severity, percent) {
  if (severity === 'critical') return 'critical';
  if (severity === 'serious') return 'serious';
  if (severity === 'warning') return 'warning';
  if (severity === 'normal') {
    if (percent >= 95) return 'critical';
    if (percent >= 85) return 'serious';
    if (percent >= 70) return 'warning';
    return 'good';
  }
  if (percent >= 95) return 'critical';
  if (percent >= 85) return 'serious';
  if (percent >= 70) return 'warning';
  return 'good';
}

function fmtResetsIn(iso) {
  if (!iso) return '';
  const ms = new Date(iso).getTime() - Date.now();
  if (ms <= 0) return 'resetting now';
  const totalMin = Math.round(ms / 60000);
  const days = Math.floor(totalMin / 1440);
  const hours = Math.floor((totalMin % 1440) / 60);
  const mins = totalMin % 60;
  const parts = [];
  if (days) parts.push(days + 'd');
  if (hours) parts.push(hours + 'h');
  if (!days && mins) parts.push(mins + 'm');
  return 'resets in ' + (parts.join(' ') || '<1m');
}

function fmtMoney(minorAmount, currency, decimals) {
  const places = decimals ?? 2;
  const amount = minorAmount / Math.pow(10, places);
  return new Intl.NumberFormat('en-US', {
    style: 'currency',
    currency: currency || 'EUR',
    minimumFractionDigits: places,
    maximumFractionDigits: places,
  }).format(amount);
}

const FIVE_HOURS_MS = 5 * 60 * 60 * 1000;
const SEVEN_DAYS_MS = 7 * 24 * 60 * 60 * 1000;

// Where usage "should" be right now if it were consumed evenly across the
// window, given only the reset time (the API doesn't expose the window's
// start) — assumes a fixed-length window, which holds for the session/weekly
// limits but not for the monthly credit grant, so this is only used there.
function expectedProgress(resetsAtIso, durationMs) {
  if (!resetsAtIso) return null;
  const resetsAt = new Date(resetsAtIso).getTime();
  const startedAt = resetsAt - durationMs;
  const frac = (Date.now() - startedAt) / durationMs;
  return Math.max(0, Math.min(100, frac * 100));
}

function fmtPaceSuffix(expected) {
  if (expected == null) return '';
  return ` · expected ~${expected.toFixed(0)}% by now`;
}

function meterCard({ label, percent, statusText, sub, expectedPercent }) {
  const status = severityToStatus(statusText, percent);
  const color = STATUS_COLOR[status];
  const pct = Math.max(0, Math.min(100, percent));
  const hasPace = expectedPercent != null;
  const expPct = hasPace ? Math.max(0, Math.min(100, expectedPercent)) : 0;
  const paceHtml = hasPace
    ? `<div class="meter-pace-track"><div class="meter-pace-fill" style="width:${expPct}%"></div></div>`
    : '';
  return `
    <div class="card">
      <div class="card-head">
        <span class="label">${label}</span>
        <span class="status-pill"><span class="status-dot" style="background:${color}"></span>${pct.toFixed(0)}%</span>
      </div>
      <div class="value">${pct.toFixed(0)}%</div>
      <div class="meter-track"><div class="meter-fill" style="width:${pct}%;background:${color}"></div></div>
      ${paceHtml}
      <div class="sub">${sub}</div>
    </div>
  `;
}

async function refresh() {
  const errorEl = document.getElementById('error');
  const cardsEl = document.getElementById('cards');
  const updatedEl = document.getElementById('updated');
  try {
    const res = await fetch('/api/usage', { cache: 'no-store' });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Unknown error');

    errorEl.classList.add('hidden');

    const limitsByKind = Object.fromEntries((data.limits || []).map(l => [l.kind, l]));
    const sessionLimit = limitsByKind.session;
    const weeklyLimit = limitsByKind.weekly_all;

    const cards = [];

    const sessionResetsAt = data.five_hour?.resets_at ?? sessionLimit?.resets_at;
    const sessionPace = expectedProgress(sessionResetsAt, FIVE_HOURS_MS);
    cards.push(meterCard({
      label: '5-hour window (session)',
      percent: data.five_hour?.utilization ?? sessionLimit?.percent ?? 0,
      statusText: sessionLimit?.severity,
      sub: fmtResetsIn(sessionResetsAt) + fmtPaceSuffix(sessionPace),
      expectedPercent: sessionPace,
    }));

    const weeklyResetsAt = data.seven_day?.resets_at ?? weeklyLimit?.resets_at;
    const weeklyPace = expectedProgress(weeklyResetsAt, SEVEN_DAYS_MS);
    cards.push(meterCard({
      label: 'Weekly limit (7 days)',
      percent: data.seven_day?.utilization ?? weeklyLimit?.percent ?? 0,
      statusText: weeklyLimit?.severity,
      sub: fmtResetsIn(weeklyResetsAt) + fmtPaceSuffix(weeklyPace),
      expectedPercent: weeklyPace,
    }));

    if (data.extra_usage?.is_enabled) {
      const eu = data.extra_usage;
      cards.push(meterCard({
        label: 'Extra usage credits',
        percent: eu.utilization ?? 0,
        statusText: data.spend?.severity,
        sub: `${fmtMoney(eu.used_credits, eu.currency, eu.decimal_places)} of ${fmtMoney(eu.monthly_limit, eu.currency, eu.decimal_places)}`,
      }));
    }

    cardsEl.innerHTML = cards.join('');
    updatedEl.textContent = 'updated ' + new Date().toLocaleTimeString('en-US');
  } catch (err) {
    errorEl.textContent = 'Failed to load data: ' + err.message;
    errorEl.classList.remove('hidden');
    updatedEl.textContent = 'update failed';
  }
}

refresh();
setInterval(refresh, 30000);

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  const output = new Uint8Array(rawData.length);
  for (let i = 0; i < rawData.length; i++) output[i] = rawData.charCodeAt(i);
  return output;
}

async function updateNotifyButton() {
  const btn = document.getElementById('notify-btn');
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
    btn.classList.add('hidden');
    return;
  }
  if (Notification.permission === 'denied') {
    btn.textContent = 'Notifications blocked';
    btn.disabled = true;
    return;
  }
  const reg = await navigator.serviceWorker.ready;
  const sub = await reg.pushManager.getSubscription();
  btn.textContent = sub ? 'Notifications enabled' : 'Enable notifications';
  btn.disabled = !!sub;
}

async function enableNotifications() {
  const btn = document.getElementById('notify-btn');
  btn.disabled = true;
  btn.textContent = 'Enabling…';
  try {
    const permission = await Notification.requestPermission();
    if (permission !== 'granted') {
      await updateNotifyButton();
      return;
    }
    const reg = await navigator.serviceWorker.ready;
    const keyRes = await fetch('/api/vapid-public-key');
    const { publicKey } = await keyRes.json();
    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(publicKey),
    });
    await fetch('/api/subscribe', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(sub),
    });
  } catch (err) {
    console.error('Failed to enable notifications:', err);
  }
  await updateNotifyButton();
}

document.getElementById('notify-btn').addEventListener('click', enableNotifications);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').then(() => updateNotifyButton());
  });
}
</script>
</body>
</html>
