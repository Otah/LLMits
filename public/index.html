<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Usage</title>

<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
<link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="theme-color" content="#2a78d6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Usage">

<script>
  // Runs before first paint so a stored choice never flashes the wrong theme.
  // The dashboard needs JS to render anything, so there is no no-JS path here.
  (function () {
    var stored = null;
    try {
      stored = localStorage.getItem('theme');
    } catch (err) {
      // Storage blocked (private mode) — fall back to the system preference.
    }
    var dark = stored ? stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  })();
</script>

<style>
  :root {
    color-scheme: light;
    --page:            #f9f9f7;
    --surface-1:       #fcfcfb;
    --text-primary:    #0b0b0b;
    --text-secondary:  #52514e;
    --text-muted:      #898781;
    --border:          rgba(11,11,11,0.10);
    --track:           #e1e0d9;
    --good:            #0ca30c;
    --warning:         #fab219;
    --serious:         #ec835a;
    --critical:        #d03b3b;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page:            #0d0d0d;
    --surface-1:       #1a1a19;
    --text-primary:    #ffffff;
    --text-secondary:  #c3c2b7;
    --text-muted:      #898781;
    --border:          rgba(255,255,255,0.10);
    --track:           #2c2c2a;
    --good:            #0ca30c;
    --warning:         #fab219;
    --serious:         #ec835a;
    --critical:        #e66767;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  html {
    min-height: 100%;
    background: var(--page);
  }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .viz-root {
    display: block;
    min-height: 100vh;
    background: var(--page);
    color: var(--text-primary);
  }
  .page {
    max-width: 720px;
    margin: 0 auto;
    padding: calc(14px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) calc(64px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));
  }
  .actions-row {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 20px;
  }
  .btn {
    font: inherit;
    font-size: 12px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface-1);
    color: var(--text-secondary);
    cursor: pointer;
  }
  .btn:disabled {
    opacity: 0.6;
    cursor: default;
  }
  .theme-btn {
    display: inline-flex;
    align-items: center;
    padding: 6px 9px;
  }
  .theme-btn svg {
    display: block;
    width: 14px;
    height: 14px;
  }
  .usage-section {
    margin-top: 0;
  }
  .usage-section:not(.hidden) + .usage-section:not(.hidden) {
    margin-top: 20px;
  }
  .section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 14px;
    margin-bottom: 12px;
  }
  h2 {
    font-size: 20px;
    font-weight: 600;
    margin: 0;
    color: var(--text-primary);
  }
  .updated {
    font-size: 13px;
    color: var(--text-muted);
  }
  .cards {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
  }
  .card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 20px;
  }
  .card-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .label {
    font-size: 14px;
    color: var(--text-secondary);
  }
  .value {
    font-size: 32px;
    font-weight: 600;
    line-height: 1;
    color: var(--text-primary);
  }
  .value-of {
    font-size: 16px;
    font-weight: 500;
    color: var(--text-muted);
  }
  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
  }
  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
  }
  .meter-track {
    height: 10px;
    border-radius: 5px;
    background: var(--track);
    overflow: hidden;
    margin-top: 4px;
  }
  .meter-fill {
    height: 100%;
    border-radius: 5px;
    transition: width 0.4s ease;
  }
  .meter-pace-track {
    height: 4px;
    border-radius: 2px;
    background: var(--track);
    overflow: hidden;
    margin-top: 6px;
  }
  .meter-pace-fill {
    height: 100%;
    border-radius: 2px;
    background: var(--text-secondary);
    opacity: 0.6;
    transition: width 0.4s ease;
  }
  .sub {
    margin-top: 8px;
    font-size: 13px;
    color: var(--text-muted);
  }
  .note {
    margin-top: 4px;
    font-size: 11px;
    color: var(--text-muted);
    opacity: 0.55;
  }
  .error {
    background: var(--surface-1);
    border: 1px solid var(--critical);
    color: var(--critical);
    border-radius: 12px;
    padding: 16px 20px;
    font-size: 14px;
  }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="viz-root">
  <div class="page">
    <div id="error" class="error hidden"></div>

    <section class="usage-section hidden" id="claude-section">
      <div class="section-head">
        <h2>Claude Usage</h2>
        <span class="updated" id="claude-updated">loading…</span>
      </div>
      <div class="cards" id="claude-cards"></div>
    </section>

    <section class="usage-section hidden" id="codex-section">
      <div class="section-head">
        <h2>Codex Usage</h2>
        <span class="updated" id="codex-updated">loading…</span>
      </div>
      <div class="cards" id="codex-cards"></div>
    </section>

    <div class="actions-row">
      <button id="theme-btn" class="btn theme-btn" type="button"></button>
      <button id="notify-btn" class="btn">Enable notifications</button>
    </div>
  </div>
</div>

<script>
const STATUS_COLOR = {
  good: 'var(--good)',
  warning: 'var(--warning)',
  serious: 'var(--serious)',
  critical: 'var(--critical)',
};

function severityToStatus(severity, percent) {
  if (severity === 'critical') return 'critical';
  if (severity === 'serious') return 'serious';
  if (severity === 'warning') return 'warning';
  if (severity === 'normal') {
    if (percent >= 95) return 'critical';
    if (percent >= 85) return 'serious';
    if (percent >= 70) return 'warning';
    return 'good';
  }
  if (percent >= 95) return 'critical';
  if (percent >= 85) return 'serious';
  if (percent >= 70) return 'warning';
  return 'good';
}

function fmtResetsIn(iso) {
  if (!iso) return '';
  const ms = new Date(iso).getTime() - Date.now();
  if (ms <= 0) return 'resetting now';
  const totalMin = Math.round(ms / 60000);
  const days = Math.floor(totalMin / 1440);
  const hours = Math.floor((totalMin % 1440) / 60);
  const mins = totalMin % 60;
  const parts = [];
  if (days) parts.push(days + 'd');
  if (hours) parts.push(hours + 'h');
  if (!days && mins) parts.push(mins + 'm');
  return 'resets in ' + (parts.join(' ') || '<1m');
}

function fmtMoney(minorAmount, currency, decimals) {
  const places = decimals ?? 2;
  const amount = minorAmount / Math.pow(10, places);
  return new Intl.NumberFormat('en-US', {
    style: 'currency',
    currency: currency || 'EUR',
    minimumFractionDigits: places,
    maximumFractionDigits: places,
  }).format(amount);
}

const FIVE_HOURS_MS = 5 * 60 * 60 * 1000;
const SEVEN_DAYS_MS = 7 * 24 * 60 * 60 * 1000;

// Where usage "should" be right now if it were consumed evenly across the
// window, given only the reset time (the API doesn't expose the window's
// start) — assumes a fixed-length window, which holds for the session/weekly
// limits but not for the monthly credit grant, so this is only used there.
function expectedProgress(resetsAtIso, durationMs) {
  if (!resetsAtIso) return null;
  const resetsAt = new Date(resetsAtIso).getTime();
  const startedAt = resetsAt - durationMs;
  const frac = (Date.now() - startedAt) / durationMs;
  return Math.max(0, Math.min(100, frac * 100));
}

function fmtPaceSuffix(expected) {
  if (expected == null) return '';
  return ` · expected ~${expected.toFixed(0)}% by now`;
}

// Anthropic's API never sends a reset date for extra usage credits, but the
// grant is billed on a calendar-month cycle — so assume next month start
// (UTC) when the API doesn't tell us otherwise.
function nextMonthBoundsUTC() {
  const now = new Date();
  const start = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), 1);
  const end = Date.UTC(now.getUTCFullYear(), now.getUTCMonth() + 1, 1);
  return { start, end };
}

function meterCard({ label, percent, statusText, sub, expectedPercent, note, valueText }) {
  const status = severityToStatus(statusText, percent);
  const color = STATUS_COLOR[status];
  const pct = Math.max(0, Math.min(100, percent));
  const hasPace = expectedPercent != null;
  const expPct = hasPace ? Math.max(0, Math.min(100, expectedPercent)) : 0;
  const paceHtml = hasPace
    ? `<div class="meter-pace-track"><div class="meter-pace-fill" style="width:${expPct}%"></div></div>`
    : '';
  const noteHtml = note ? `<div class="note">${note}</div>` : '';
  return `
    <div class="card">
      <div class="card-head">
        <span class="label">${label}</span>
        <span class="status-pill"><span class="status-dot" style="background:${color}"></span>${pct.toFixed(0)}%</span>
      </div>
      <div class="value">${valueText ?? pct.toFixed(0) + '%'}</div>
      <div class="meter-track"><div class="meter-fill" style="width:${pct}%;background:${color}"></div></div>
      ${paceHtml}
      <div class="sub">${sub}</div>
      ${noteHtml}
    </div>
  `;
}

// Reflect the worst meter in the tab so a backgrounded tab shows status at a glance.
function setFavicon(color) {
  const c = document.createElement('canvas');
  c.width = c.height = 32;
  const ctx = c.getContext('2d');
  ctx.beginPath();
  ctx.arc(16, 16, 13, 0, 2 * Math.PI);
  ctx.fillStyle = color;
  ctx.fill();
  let link = document.querySelector('link[rel="icon"][data-dynamic]');
  if (!link) {
    // Drop the static icon links so there is no ambiguity over which favicon wins.
    document.querySelectorAll('link[rel~="icon"]').forEach(el => el.remove());
    link = document.createElement('link');
    link.rel = 'icon';
    link.dataset.dynamic = '1';
    document.head.appendChild(link);
  }
  link.href = c.toDataURL('image/png');
}

function cssVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

function updateTab(percent, status) {
  document.title = `${Math.round(percent)}% · Usage`;
  setFavicon(cssVar('--' + status) || '#888');
}

async function refresh() {
  const errorEl = document.getElementById('error');
  const claudeSection = document.getElementById('claude-section');
  const claudeCardsEl = document.getElementById('claude-cards');
  const claudeUpdatedEl = document.getElementById('claude-updated');
  const codexSection = document.getElementById('codex-section');
  const codexCardsEl = document.getElementById('codex-cards');
  const codexUpdatedEl = document.getElementById('codex-updated');
  const updatedText = 'updated ' + new Date().toLocaleTimeString('en-US');

  const results = await Promise.allSettled([
    fetch('/api/usage', { cache: 'no-store' }),
    fetch('/api/codex/usage', { cache: 'no-store' }),
  ]);

  let visibleSections = 0;
  let lastError = null;

  // Track the highest-utilization meter across every section for the tab indicator.
  let worst = null;
  function render(opts) {
    const p = opts.percent ?? 0;
    if (!worst || p > worst.percent) worst = { percent: p, statusText: opts.statusText };
    return meterCard(opts);
  }

  try {
    const res = results[0].status === 'fulfilled' ? results[0].value : null;
    if (!res) throw results[0].reason;
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Unknown error');

    const limitsByKind = Object.fromEntries((data.limits || []).map(l => [l.kind, l]));
    const sessionLimit = limitsByKind.session;
    const weeklyLimit = limitsByKind.weekly_all;

    const cards = [];

    const sessionResetsAt = data.five_hour?.resets_at ?? sessionLimit?.resets_at;
    const sessionPace = expectedProgress(sessionResetsAt, FIVE_HOURS_MS);
    cards.push(render({
      label: '5-hour window (session)',
      percent: data.five_hour?.utilization ?? sessionLimit?.percent ?? 0,
      statusText: sessionLimit?.severity,
      sub: fmtResetsIn(sessionResetsAt) + fmtPaceSuffix(sessionPace),
      expectedPercent: sessionPace,
    }));

    const weeklyResetsAt = data.seven_day?.resets_at ?? weeklyLimit?.resets_at;
    const weeklyPace = expectedProgress(weeklyResetsAt, SEVEN_DAYS_MS);
    cards.push(render({
      label: 'Weekly limit (7 days)',
      percent: data.seven_day?.utilization ?? weeklyLimit?.percent ?? 0,
      statusText: weeklyLimit?.severity,
      sub: fmtResetsIn(weeklyResetsAt) + fmtPaceSuffix(weeklyPace),
      expectedPercent: weeklyPace,
    }));

    if (data.extra_usage?.is_enabled) {
      const eu = data.extra_usage;
      const euValue = `${fmtMoney(eu.used_credits, eu.currency, eu.decimal_places)} <span class="value-of">of ${fmtMoney(eu.monthly_limit, eu.currency, eu.decimal_places)}</span>`;
      let resetSub = '';
      let euPace = null;
      let euNote = '';
      if (eu.resets_at) {
        resetSub = fmtResetsIn(eu.resets_at);
        euPace = expectedProgress(eu.resets_at, nextMonthBoundsUTC().end - nextMonthBoundsUTC().start);
      } else {
        const { start, end } = nextMonthBoundsUTC();
        resetSub = fmtResetsIn(new Date(end).toISOString());
        euPace = Math.max(0, Math.min(100, ((Date.now() - start) / (end - start)) * 100));
        euNote = 'Not explicitly reported, assuming calendar-month reset.';
      }
      cards.push(render({
        label: 'Extra usage credits',
        percent: eu.utilization ?? 0,
        statusText: data.spend?.severity,
        valueText: euValue,
        sub: resetSub + fmtPaceSuffix(euPace),
        expectedPercent: euPace,
        note: euNote,
      }));
    }

    claudeCardsEl.innerHTML = cards.join('');
    claudeUpdatedEl.textContent = updatedText;
    claudeSection.classList.remove('hidden');
    visibleSections += 1;
  } catch (err) {
    claudeSection.classList.add('hidden');
    claudeCardsEl.innerHTML = '';
    lastError = err;
  }

  try {
    const res = results[1].status === 'fulfilled' ? results[1].value : null;
    if (!res) throw results[1].reason;
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Unknown error');

    const limit = data.codex;
    const resetsAt = limit?.resets_at;
    const windowMs = (limit?.window_duration_mins || 0) * 60 * 1000;
    const expected = windowMs ? expectedProgress(resetsAt, windowMs) : null;
    codexCardsEl.innerHTML = render({
      label: 'Weekly limit (7 days)',
      percent: limit?.utilization ?? 0,
      statusText: data.limits?.[0]?.severity,
      sub: fmtResetsIn(resetsAt) + fmtPaceSuffix(expected),
      expectedPercent: expected,
    });
    codexUpdatedEl.textContent = updatedText;
    codexSection.classList.remove('hidden');
    visibleSections += 1;
  } catch (err) {
    codexSection.classList.add('hidden');
    codexCardsEl.innerHTML = '';
    lastError = err;
  }

  if (visibleSections) {
    errorEl.classList.add('hidden');
    if (worst) updateTab(worst.percent, severityToStatus(worst.statusText, worst.percent));
  } else {
    errorEl.textContent = 'Failed to load usage data: ' + (lastError?.message || 'No available usage source.');
    errorEl.classList.remove('hidden');
    document.title = '⚠ Usage';
    setFavicon(cssVar('--text-muted') || '#888');
  }
}

refresh();
setInterval(refresh, 30000);

// The button shows the theme it switches *to*, not the current one.
const THEME_ICON = {
  dark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
  light: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>',
};

function storedTheme() {
  try {
    return localStorage.getItem('theme');
  } catch (err) {
    return null;
  }
}

function applyTheme(theme) {
  const root = document.documentElement;
  root.dataset.theme = theme;

  // Keep the PWA/browser chrome in step with the page background.
  const page = getComputedStyle(root).getPropertyValue('--page').trim();
  if (page) document.querySelector('meta[name="theme-color"]').setAttribute('content', page);

  const next = theme === 'dark' ? 'light' : 'dark';
  const btn = document.getElementById('theme-btn');
  btn.innerHTML = THEME_ICON[next];
  btn.title = `Switch to ${next} theme`;
  btn.setAttribute('aria-label', btn.title);
}

document.getElementById('theme-btn').addEventListener('click', () => {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  try {
    localStorage.setItem('theme', next);
  } catch (err) {
    // Storage blocked — the choice still applies for this page load.
  }
  applyTheme(next);
});

// Until a choice is made, keep following the OS even while the page stays open.
// Held in a variable on purpose: an unreferenced MediaQueryList can be collected
// and stop firing in older WebKit, which is exactly where this runs as a PWA.
const darkQuery = matchMedia('(prefers-color-scheme: dark)');
darkQuery.addEventListener('change', (event) => {
  if (!storedTheme()) applyTheme(event.matches ? 'dark' : 'light');
});

applyTheme(document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light');

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  const output = new Uint8Array(rawData.length);
  for (let i = 0; i < rawData.length; i++) output[i] = rawData.charCodeAt(i);
  return output;
}

async function updateNotifyButton() {
  const btn = document.getElementById('notify-btn');
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
    btn.classList.add('hidden');
    return;
  }
  if (Notification.permission === 'denied') {
    btn.textContent = 'Notifications blocked';
    btn.disabled = true;
    return;
  }
  const reg = await navigator.serviceWorker.ready;
  const sub = await reg.pushManager.getSubscription();
  btn.textContent = sub ? 'Notifications enabled' : 'Enable notifications';
  btn.disabled = !!sub;
}

async function enableNotifications() {
  const btn = document.getElementById('notify-btn');
  btn.disabled = true;
  btn.textContent = 'Enabling…';
  try {
    const permission = await Notification.requestPermission();
    if (permission !== 'granted') {
      await updateNotifyButton();
      return;
    }
    const reg = await navigator.serviceWorker.ready;
    const keyRes = await fetch('/api/vapid-public-key');
    const { publicKey } = await keyRes.json();
    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(publicKey),
    });
    await fetch('/api/subscribe', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(sub),
    });
  } catch (err) {
    console.error('Failed to enable notifications:', err);
  }
  await updateNotifyButton();
}

document.getElementById('notify-btn').addEventListener('click', enableNotifications);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').then((reg) => {
      updateNotifyButton();

      // Reload once a new SW takes over, so an already-open tab can't keep
      // rendering the old build after an update.
      let refreshed = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (refreshed) return;
        refreshed = true;
        window.location.reload();
      });

      // Force an update check whenever the app is foregrounded — a backgrounded
      // PWA can be suspended for a long time without ever re-checking for updates.
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') reg.update();
      });
    });
  });
}
</script>
</body>
</html>
